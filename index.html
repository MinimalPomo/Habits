<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Tracker - Neubrutalist</title>
    <!-- High-impact Sans Serif Font -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            font-family: 'Public Sans', sans-serif; 
            background-color: #FFF4E0; /* Warm paper-like background */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Neumorphic/Brutalist Shadow Utility */
        .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-md { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-lg { box-shadow: 10px 10px 0px 0px rgba(0,0,0,1); }
        
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 8px; 
        }

        /* Prevent layout shift on toggle */
        .info-panel {
            transition: all 0.2s steps(4);
        }
    </style>
</head>
<body class="text-black antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [habits, setHabits] = useState({});
            const [showInfo, setShowInfo] = useState(false);

            // In-memory state sync with LocalStorage
            useEffect(() => {
                const saved = localStorage.getItem('neo-habit-data');
                if (saved) setHabits(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('neo-habit-data', JSON.stringify(habits));
            }, [habits]);

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthName = currentDate.toLocaleString('default', { month: 'long' });

            const toggleDay = (day) => {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const currentStatus = habits[dateKey] || 'none';
                
                // Cycle: None -> Done -> Missed -> None
                let nextStatus = 'none';
                if (currentStatus === 'none') nextStatus = 'done';
                else if (currentStatus === 'done') nextStatus = 'missed';
                
                setHabits(prev => ({ ...prev, [dateKey]: nextStatus }));
            };

            const stats = () => {
                const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
                const keys = Object.keys(habits).filter(k => k.startsWith(prefix));
                return {
                    done: keys.filter(k => habits[k] === 'done').length,
                    missed: keys.filter(k => habits[k] === 'missed').length
                };
            };

            const renderCalendarDays = () => {
                const days = [];
                const totalDays = new Date(year, month + 1, 0).getDate();
                const startOffset = new Date(year, month, 1).getDay();

                // Empty slots for start of month
                for (let i = 0; i < startOffset; i++) {
                    days.push(<div key={`empty-${i}`} className="h-12 w-full" />);
                }
                
                for (let d = 1; d <= totalDays; d++) {
                    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const status = habits[dateKey] || 'none';
                    const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
                    
                    let bgColor = 'bg-white';
                    if (status === 'done') bgColor = 'bg-[#00FF66]'; // Neon Green
                    if (status === 'missed') bgColor = 'bg-[#FF4646]'; // Vibrant Red
                    if (isToday && status === 'none') bgColor = 'bg-[#FFDE00]'; // Cyber Yellow

                    days.push(
                        <button 
                            key={d} 
                            onClick={() => toggleDay(d)} 
                            className={`h-12 w-full border-2 border-black font-black text-sm transition-all active:translate-x-[2px] active:translate-y-[2px] active:shadow-none neo-shadow-sm ${bgColor}`}
                        >
                            {d}
                        </button>
                    );
                }
                return days;
            };

            return (
                <div className="max-w-md mx-auto p-6 min-h-screen">
                    <header className="flex justify-between items-center mb-10">
                        <div className="bg-white border-4 border-black p-4 neo-shadow-md -rotate-1">
                            <h1 className="text-4xl font-black uppercase italic leading-none tracking-tighter">
                                Habit Log
                            </h1>
                        </div>
                        <button 
                            onClick={() => setShowInfo(!showInfo)} 
                            className={`bg-[#A3E635] border-2 border-black p-3 neo-shadow-sm active:shadow-none active:translate-x-1 active:translate-y-1 transition-all ${showInfo ? 'rotate-12' : ''}`}
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="square"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        </button>
                    </header>

                    {showInfo && (
                        <div className="mb-8 p-4 bg-white border-4 border-black neo-shadow-sm font-bold uppercase text-[10px] leading-tight rotate-1">
                            <p className="mb-3 border-b-2 border-black pb-1">Instruction Manual:</p>
                            <div className="space-y-2">
                                <div className="flex items-center gap-3"><div className="w-4 h-4 border-2 border-black bg-[#00FF66]"></div><span>Click x1: Achievement Unlocked</span></div>
                                <div className="flex items-center gap-3"><div className="w-4 h-4 border-2 border-black bg-[#FF4646]"></div><span>Click x2: Mission Failed</span></div>
                                <div className="flex items-center gap-3"><div className="w-4 h-4 border-2 border-black bg-white"></div><span>Click x3: Data Reset</span></div>
                                <div className="flex items-center gap-3"><div className="w-4 h-4 border-2 border-black bg-[#FFDE00]"></div><span>Yellow Square: Current Target</span></div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-2 gap-6 mb-10">
                        <div className="bg-[#00FF66] p-4 border-4 border-black neo-shadow-md transform hover:-rotate-2 transition-transform">
                            <p className="text-xs font-black uppercase mb-1 tracking-widest">Done</p>
                            <p className="text-5xl font-black">{stats().done}</p>
                        </div>
                        <div className="bg-[#FF4646] p-4 border-4 border-black neo-shadow-md transform hover:rotate-2 transition-transform">
                            <p className="text-xs font-black uppercase mb-1 tracking-widest">Missed</p>
                            <p className="text-5xl font-black text-white">{stats().missed}</p>
                        </div>
                    </div>

                    <div className="bg-white border-4 border-black p-6 neo-shadow-lg relative overflow-hidden">
                        <div className="flex justify-between items-center mb-8 border-b-4 border-black pb-4">
                            <button 
                                onClick={() => setCurrentDate(new Date(year, month - 1, 1))} 
                                className="bg-[#FFDE00] hover:bg-black hover:text-white transition-colors p-2 border-2 border-black neo-shadow-sm active:shadow-none"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="square"><path d="m15 18-6-6 6-6"/></svg>
                            </button>
                            <div className="text-center">
                                <h2 className="text-2xl font-black uppercase italic tracking-tighter leading-none">{monthName}</h2>
                                <span className="text-sm font-black opacity-30">{year}</span>
                            </div>
                            <button 
                                onClick={() => setCurrentDate(new Date(year, month + 1, 1))} 
                                className="bg-[#FFDE00] hover:bg-black hover:text-white transition-colors p-2 border-2 border-black neo-shadow-sm active:shadow-none"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="square"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                        </div>
                        
                        <div className="calendar-grid text-[10px] font-black mb-6 text-center">
                            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(s => (
                                <div key={s} className="uppercase bg-black text-white py-1 border border-black">
                                    {s}
                                </div>
                            ))}
                        </div>
                        
                        <div className="calendar-grid">
                            {renderCalendarDays()}
                        </div>
                        
                        {/* Aesthetic decorative element */}
                        <div className="absolute -bottom-2 -right-2 w-12 h-12 bg-black rotate-45 opacity-10 pointer-events-none"></div>
                    </div>
                    
                    <footer className="mt-12 text-center">
                        <p className="text-[10px] font-black uppercase tracking-[0.2em] opacity-40">System v2.0 // Brutal Edition</p>
                    </footer>
                </div>
            );
        };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
    </script>
</body>
</html>
